name: DevPulse Bot

on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  lint:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n devpulse.sh
      - name: Shellcheck
        run: shellcheck install.sh devpulse.sh

  welcome:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 Thanks for opening an issue! **DevPulse** bot here. d-rathnayake will review it soon. ✦"
            });
