<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="DevPulse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#140a26"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.35"/>
  <rect x="18" y="18" width="1164" height="284" rx="16" fill="none" stroke="url(#ac)" stroke-width="2" opacity="0.6"/>
  <path d="M18 64 V18 H64 M1182 64 V18 H1136 M18 256 V302 H64 M1182 256 V302 H1136" fill="none" stroke="#22d3ee" stroke-width="3"/>

  <text x="70" y="112" font-family="Consolas, Menlo, monospace" font-size="72" font-weight="700" fill="#e2e8f0" letter-spacing="8">DEVPULSE</text>
  <text x="72" y="154" font-family="Consolas, Menlo, monospace" font-size="24" fill="url(#ac)">repo health / device report / github profile</text>
  <text x="72" y="190" font-family="Consolas, Menlo, monospace" font-size="18" fill="#64748b">version 1.1.0 - built for Termux - by d-rathnayake</text>

  <g filter="url(#glow)">
    <path d="M70 250 H380 L400 214 L420 286 L440 232 L460 250 H700 L720 204 L742 292 L764 240 L784 250 H1130"
          fill="none" stroke="url(#ac)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="1300" stroke-dashoffset="1300">
      <animate attributeName="stroke-dashoffset" from="1300" to="0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(860,56)">
    <rect width="280" height="112" rx="10" fill="#0b1020" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="18" y="30" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94a3b8">PROFILE    READY</text>
    <text x="18" y="56" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94a3b8">SCAN       READY</text>
    <text x="18" y="82" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94a3b8">DEVICE     READY</text>
    <text x="18" y="104" font-family="Consolas, Menlo, monospace" font-size="13" fill="#a855f7">[##########..........] 72/100</text>
  </g>
</svg>
